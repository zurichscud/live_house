appId: com.livehouse.desktop
productName: LIVE HOUSE
copyright: Copyright © 2026

directories:
  output: release/${version}
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true
npmRebuild: false

mac:
  category: public.app-category.entertainment
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  darkModeSupport: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: LIVE HOUSE

dmg:
  title: LIVE HOUSE
