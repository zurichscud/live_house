syntax = "proto3";

package douyin;

// 以下定义裁剪自 simple_live_core/lib/src/danmaku/proto/douyin.proto，
// 仅保留弹幕接收链路所需的消息与字段（未定义字段解析时会被跳过）。

message Response {
  repeated Message messagesList = 1;
  string cursor = 2;
  uint64 fetchInterval = 3;
  uint64 now = 4;
  string internalExt = 5;
  uint32 fetchType = 6;
  map<string, string> routeParams = 7;
  uint64 heartbeatDuration = 8;
  bool needAck = 9;
  string pushServer = 10;
  string liveCursor = 11;
  bool historyNoMore = 12;
}

message Message {
  string method = 1;
  bytes payload = 2;
  int64 msgId = 3;
  int32 msgType = 4;
  int64 offset = 5;
  bool needWrdsStore = 6;
  int64 wrdsVersion = 7;
  string wrdsSubKey = 8;
}

message ChatMessage {
  Common common = 1;
  User user = 2;
  string content = 3;
}

message RoomUserSeqMessage {
  Common common = 1;
  int64 total = 3;
  string popStr = 4;
  int64 popularity = 6;
  int64 totalUser = 7;
  string totalUserStr = 8;
  string totalStr = 9;
}

message User {
  uint64 id = 1;
  uint64 shortId = 2;
  string nickName = 3;
}

message Common {
  string method = 1;
  uint64 msgId = 2;
  uint64 roomId = 3;
  uint64 createTime = 4;
}

message PushFrame {
  uint64 seqId = 1;
  uint64 logId = 2;
  uint64 service = 3;
  uint64 method = 4;
  string payloadEncoding = 6;
  string payloadType = 7;
  bytes payload = 8;
}
